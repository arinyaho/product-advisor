services:
  product-advisor:
    build: ./mcp
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"  # match the owner of ./data; the deploy script sets both
    env_file: .env                      # OPENROUTER_API_KEY
    volumes:
      - ./data:/data                    # book.pdf, keys.json, cached vectors
    ports:
      - "127.0.0.1:${PORT:-8765}:8000"  # reachable only through a reverse proxy on the host
